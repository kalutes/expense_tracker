<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Border -->
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#30363d" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="#161b22" stroke-width="4"/>

  <!-- Terminal Window Bar -->
  <path d="M 28 96 L 484 96" stroke="#21262d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="68" cy="62" r="10" fill="#f43f5e" opacity="0.8"/>
  <circle cx="102" cy="62" r="10" fill="#f59e0b" opacity="0.8"/>
  <circle cx="136" cy="62" r="10" fill="#10b981" opacity="0.8"/>
  
  <!-- Terminal Prompt >_ -->
  <g filter="url(#glow)">
    <!-- Greater-than arrow > -->
    <path d="M 80 180 L 160 250 L 80 320" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cursor Block _ -->
    <rect x="190" y="296" width="70" height="24" rx="4" fill="#34d399"/>
  </g>

  <!-- Currency / Ledger Matrix Badges -->
  <g font-family="monospace, ui-monospace, SFMono-Regular, Menlo, Consolas" font-weight="900">
    <!-- USD / JPY Dual Currency Motif -->
    <rect x="300" y="160" width="136" height="56" rx="12" fill="#161b22" stroke="#34d399" stroke-width="3" opacity="0.9"/>
    <text x="368" y="198" font-size="28" fill="#34d399" text-anchor="middle" letter-spacing="1">USD / $</text>

    <rect x="300" y="240" width="136" height="56" rx="12" fill="#161b22" stroke="#818cf8" stroke-width="3" opacity="0.9"/>
    <text x="368" y="278" font-size="28" fill="#818cf8" text-anchor="middle" letter-spacing="1">JPY / ¥</text>
  </g>

  <!-- Bottom Cyber Grid / Ledger Tick Bar -->
  <g stroke="#30363d" stroke-width="2" opacity="0.7">
    <line x1="80" y1="380" x2="432" y2="380"/>
    <line x1="80" y1="410" x2="432" y2="410"/>
    <line x1="80" y1="440" x2="432" y2="440"/>
  </g>
  <g stroke="#34d399" stroke-width="3" opacity="0.8">
    <line x1="80" y1="380" x2="220" y2="380"/>
    <line x1="80" y1="410" x2="340" y2="410"/>
    <line x1="80" y1="440" x2="160" y2="440"/>
  </g>
  <text x="432" y="446" font-family="monospace" font-size="16" fill="#64748b" text-anchor="end">SYS.ONLINE</text>
</svg>
